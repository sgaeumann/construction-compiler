stages:
- analyze
- test
- deploy

default:
  image: python:3.12
  before_script:
    # install uv
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"

lint:
  stage: analyze
  script:
    - uv run pre-commit run --all-files

unit-test:
  stage: test
  script:
    - uv run pytest

build-docs:
  stage: deploy
  script:
    - cd docs
    - uv run make html
  artifacts:
    paths:
      - docs/build/html


deploy-pages:
  stage: deploy
  dependencies:
    - build-docs
  script:
    # Copy built docs to public directory
    - mkdir -p public
    - cp -r docs/build/html/* public/
  artifacts:
    paths:
      - public
  pages:
    publish: public
